services:
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      STU_HOST: 0.0.0.0
      PORT: 8080
      STU_STORAGE: sqlite
      STU_DATA: /app/data/club.json
      STU_REQUIRE_VERIFICATION: "true"
      STU_TRUST_PROXY: "true"
      STU_ADMIN_EMAILS: ${STU_ADMIN_EMAILS:?Set the administrator email}
      STU_MAIL_MODE: ${STU_MAIL_MODE:-outbox}
      STU_SMTP_HOST: ${STU_SMTP_HOST:-}
      STU_SMTP_PORT: ${STU_SMTP_PORT:-587}
      STU_SMTP_USER: ${STU_SMTP_USER:-}
      STU_SMTP_PASSWORD: ${STU_SMTP_PASSWORD:-}
      STU_SMTP_SSL: ${STU_SMTP_SSL:-false}
      STU_MAIL_FROM: ${STU_MAIL_FROM:-}
      STU_FCM_PROJECT: ${STU_FCM_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - club_data:/app/data
      - club_backups:/app/backups
      - ./.secrets:/run/secrets:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "dart", "run", "tool/health.dart"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      STU_DOMAIN: ${STU_DOMAIN:?Set a real domain pointing to the server}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  club_data:
  club_backups:
  caddy_data:
  caddy_config:
